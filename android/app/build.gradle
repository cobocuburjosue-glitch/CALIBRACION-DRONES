plugins { id 'com.android.application' }

def vc = (project.findProperty('vc') ?: '1').toString().toInteger()

android {
    namespace 'gt.madretierra.calibracion'
    compileSdk 34
    defaultConfig {
        applicationId 'gt.madretierra.calibracion'
        minSdk 23
        targetSdk 34
        versionCode vc
        versionName "1.0.${vc}"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_PATH') ?: 'release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias System.getenv('KS_ALIAS') ?: 'calibracion'
            keyPassword System.getenv('KS_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
