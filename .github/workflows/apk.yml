name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Llave de firma
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Usando la llave de firma oficial (secretos KS_B64 / KS_PASS)."
          else
            echo "::warning::Faltan los secretos KS_B64 y KS_PASS: se firma con una llave temporal. Para actualizar la app sin desinstalar, agregue los secretos."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias calibracion -keyalg RSA -keysize 2048 -validity 10000 -storepass temporal123 -keypass temporal123 -dname "CN=Temporal"
            echo "KS_PASS=temporal123" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          KS_PATH: ${{ runner.temp }}/release.jks
          KS_ALIAS: calibracion
        run: gradle -p android assembleRelease -Pvc=${{ github.run_number }} --no-daemon

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk calibracion-drones.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: App Android – Calibración de Boquillas
          body: |
            APK de la app de Calibración de Boquillas (Ingenio Madre Tierra).
            Descarga directa: https://github.com/${{ github.repository }}/releases/download/apk/calibracion-drones.apk
          files: calibracion-drones.apk
          make_latest: true

      - name: Publicar APK en la página (descarga directa + actualizaciones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p descargas
          cp calibracion-drones.apk descargas/calibracion-drones.apk
          cat > descargas/version.json <<JSON
          {"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}", "url": "https://cobocuburjosue-glitch.github.io/CALIBRACION-DRONES/descargas/calibracion-drones.apk"}
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas
          git commit -m "APK 1.0.${{ github.run_number }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
